<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot บันทึกรายจ่าย</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e0e3e8;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-soft: #eaf0fe;
    --user-bubble: #2563eb;
    --user-bubble-text: #ffffff;
    --bot-bubble: #eef0f4;
    --error-bg: #fdecec;
    --error-border: #f3b4b4;
    --success-bg: #eafaf0;
    --success-border: #a9e3bf;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: "Segoe UI", "Noto Sans Thai", Tahoma, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    padding: 14px 20px;
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  header h1 {
    font-size: 16px;
    margin: 0;
    font-weight: 600;
  }

  header span {
    font-size: 12px;
    color: var(--muted);
  }

  .layout {
    flex: 1;
    display: flex;
    min-height: 0;
    gap: 12px;
    padding: 12px;
  }

  @media (max-width: 860px) {
    .layout { flex-direction: column; }
  }

  .chat-panel, .dash-panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

  .chat-panel { flex: 2; }
  .dash-panel { flex: 1; min-width: 280px; }

  .panel-title {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 10px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text);
  }
  .refresh-btn:hover { background: var(--accent-soft); }

  /* ---- chat ---- */

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .msg-row { display: flex; }
  .msg-row.user { justify-content: flex-end; }
  .msg-row.bot { justify-content: flex-start; }

  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .msg-row.user .bubble {
    background: var(--user-bubble);
    color: var(--user-bubble-text);
    border-bottom-right-radius: 3px;
  }

  .msg-row.bot .bubble {
    background: var(--bot-bubble);
    border-bottom-left-radius: 3px;
  }

  .bubble.error { background: var(--error-bg); border: 1px solid var(--error-border); }
  .bubble.success { background: var(--success-bg); border: 1px solid var(--success-border); }

  .bubble img.thumb {
    max-width: 220px;
    max-height: 220px;
    border-radius: 8px;
    display: block;
    margin-top: 8px;
  }

  .receipt-card {
    margin-top: 8px;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: #fff;
  }

  .receipt-card table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .receipt-card td { padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .receipt-card td:first-child { color: var(--muted); white-space: nowrap; width: 40%; }
  .receipt-card tr:last-child td { border-bottom: none; }
  .receipt-card td.missing { color: #b45309; font-style: italic; }

  .typing { color: var(--muted); font-style: italic; font-size: 13px; }

  form#chat-form {
    border-top: 1px solid var(--border);
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .preview-row {
    display: none;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: var(--muted);
    background: var(--accent-soft);
    border-radius: 6px;
    padding: 6px 10px;
  }
  .preview-row.active { display: flex; }
  .preview-row img { height: 36px; width: 36px; object-fit: cover; border-radius: 4px; }
  .preview-row button {
    margin-left: auto;
    border: none;
    background: none;
    color: var(--accent);
    cursor: pointer;
    font-size: 12px;
  }

  .input-row { display: flex; gap: 8px; align-items: center; }

  .input-row input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 20px;
    font-size: 14px;
    outline: none;
  }
  .input-row input[type="text"]:focus { border-color: var(--accent); }

  .icon-btn {
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 50%;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 16px;
    flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--accent-soft); }

  #send-btn {
    border: none;
    background: var(--accent);
    color: #fff;
    border-radius: 20px;
    padding: 10px 18px;
    font-size: 14px;
    cursor: pointer;
    flex-shrink: 0;
  }
  #send-btn:disabled { opacity: .6; cursor: default; }

  /* ---- dashboard ---- */

  #dash-body {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  .dash-empty {
    padding: 20px 16px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
  }

  .dash-row {
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }
  .dash-row:last-child { border-bottom: none; }

  .dash-row .payee {
    font-weight: 600;
    margin-bottom: 2px;
  }
  .dash-row .amount {
    float: right;
    font-weight: 600;
    color: var(--accent);
  }
  .dash-row .meta {
    color: var(--muted);
    font-size: 12px;
    margin-top: 2px;
  }

  .dash-row.new {
    animation: flash 1.4s ease-out;
  }
  @keyframes flash {
    from { background: var(--success-bg); }
    to { background: transparent; }
  }
</style>
</head>
<body>

<header>
  <h1>Chatbot บันทึกรายจ่าย</h1>
  <span>ถามตอบทั่วไป หรือแนบรูปใบเสร็จเพื่อบันทึกอัตโนมัติ</span>
</header>

<div class="layout">

  <section class="chat-panel">
    <div class="panel-title">ห้องแชท</div>
    <div id="messages"></div>

    <form id="chat-form">
      <div class="preview-row" id="preview-row">
        <img id="preview-img" src="" alt="">
        <span id="preview-name"></span>
        <button type="button" id="remove-image">ลบรูป</button>
      </div>
      <div class="input-row">
        <button type="button" class="icon-btn" id="attach-btn" title="แนบรูปใบเสร็จ">📎</button>
        <input type="file" id="image-input" accept="image/jpeg,image/png,.jpg,.jpeg,.png" hidden>
        <input type="text" id="text-input" placeholder="พิมพ์ข้อความ หรือแนบรูปใบเสร็จ...">
        <button type="submit" id="send-btn">ส่ง</button>
      </div>
    </form>
  </section>

  <section class="dash-panel">
    <div class="panel-title">
      รายการที่บันทึกแล้ว
      <button class="refresh-btn" id="refresh-btn">รีเฟรช</button>
    </div>
    <div id="dash-body"><div class="dash-empty">กำลังโหลด...</div></div>
  </section>

</div>

<script>
const messagesEl = document.getElementById('messages');
const chatForm = document.getElementById('chat-form');
const textInput = document.getElementById('text-input');
const imageInput = document.getElementById('image-input');
const attachBtn = document.getElementById('attach-btn');
const sendBtn = document.getElementById('send-btn');
const previewRow = document.getElementById('preview-row');
const previewImg = document.getElementById('preview-img');
const previewName = document.getElementById('preview-name');
const removeImageBtn = document.getElementById('remove-image');
const dashBody = document.getElementById('dash-body');
const refreshBtn = document.getElementById('refresh-btn');

let selectedFile = null;

// ---------- แนบรูป ----------

attachBtn.addEventListener('click', () => imageInput.click());

imageInput.addEventListener('change', () => {
  const file = imageInput.files[0];
  if (!file) return;
  selectedFile = file;
  previewImg.src = URL.createObjectURL(file);
  previewName.textContent = file.name;
  previewRow.classList.add('active');
});

removeImageBtn.addEventListener('click', () => {
  selectedFile = null;
  imageInput.value = '';
  previewRow.classList.remove('active');
});

// ---------- ห้องแชท ----------

function addBubble(role, opts = {}) {
  const row = document.createElement('div');
  row.className = 'msg-row ' + (role === 'user' ? 'user' : 'bot');

  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (opts.variant ? ' ' + opts.variant : '');

  if (opts.text) {
    const p = document.createElement('div');
    p.textContent = opts.text;
    bubble.appendChild(p);
  }

  if (opts.imageUrl) {
    const img = document.createElement('img');
    img.className = 'thumb';
    img.src = opts.imageUrl;
    bubble.appendChild(img);
  }

  if (opts.receiptData) {
    bubble.appendChild(buildReceiptCard(opts.receiptData));
  }

  row.appendChild(bubble);
  messagesEl.appendChild(row);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return bubble;
}

function fieldRow(label, value) {
  const missing = (value === null || value === undefined || value === '');
  return `<tr><td>${label}</td><td class="${missing ? 'missing' : ''}">${missing ? 'อ่านไม่ออก' : escapeHtml(String(value))}</td></tr>`;
}

function buildReceiptCard(data) {
  const card = document.createElement('div');
  card.className = 'receipt-card';
  card.innerHTML = `<table>
    ${fieldRow('วันที่จ่ายเงิน', data.payment_date)}
    ${fieldRow('เลขที่ใบเสร็จ', data.receipt_no)}
    ${fieldRow('ผู้รับเงิน', data.payee)}
    ${fieldRow('จำนวนเงิน', data.amount !== null && data.amount !== undefined ? Number(data.amount).toLocaleString('th-TH', {minimumFractionDigits: 2}) + ' บาท' : null)}
  </table>`;
  return card;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

chatForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = textInput.value.trim();
  const file = selectedFile;

  if (!text && !file) return;

  // แสดงข้อความของผู้ใช้ทันที
  addBubble('user', {
    text: text || (file ? '(แนบรูปใบเสร็จ)' : ''),
    imageUrl: file ? URL.createObjectURL(file) : null,
  });

  const typingBubble = addBubble('bot', { text: 'กำลังประมวลผล...' });
  typingBubble.classList.add('typing');

  textInput.value = '';
  imageInput.value = '';
  selectedFile = null;
  previewRow.classList.remove('active');
  sendBtn.disabled = true;

  try {
    const formData = new FormData();
    formData.append('message', text);
    if (file) formData.append('image', file);

    const res = await fetch('/api/chat', { method: 'POST', body: formData });
    const payload = await res.json().catch(() => null);

    typingBubble.parentElement.remove();

    if (!res.ok) {
      addBubble('bot', {
        text: (payload && payload.detail) ? payload.detail : `เกิดข้อผิดพลาด (${res.status})`,
        variant: 'error',
      });
      return;
    }

    if (payload.type === 'receipt') {
      addBubble('bot', { text: payload.reply, receiptData: payload.data, variant: 'success' });
      prependDashRow(payload.data);
    } else if (payload.type === 'receipt_error') {
      addBubble('bot', { text: payload.reply, variant: 'error' });
    } else {
      addBubble('bot', { text: payload.reply });
    }
  } catch (err) {
    typingBubble.parentElement.remove();
    addBubble('bot', { text: 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้: ' + err.message, variant: 'error' });
  } finally {
    sendBtn.disabled = false;
  }
});

// ---------- Dashboard ----------

function formatSavedAt(raw) {
  // "YYYY-MM-DD HH:MM:SS.ffffff" -> "DD/MM/YYYY HH:MM:SS"
  const m = raw.match(/^(\d{4})-(\d{2})-(\d{2}) (\d{2}:\d{2}:\d{2})/);
  if (!m) return raw;
  return `${m[3]}/${m[2]}/${m[1]} ${m[4]}`;
}

function dashRowHtml(row, isNew) {
  const amountText = (row.amount !== '' && row.amount !== null && row.amount !== undefined)
    ? Number(row.amount).toLocaleString('th-TH', {minimumFractionDigits: 2}) + ' บาท'
    : '-';
  const payee = row.payee || '(ไม่ทราบผู้รับเงิน)';
  const receiptNo = row.receipt_no ? `เลขที่ ${escapeHtml(row.receipt_no)} · ` : '';
  const paymentDate = row.payment_date || '-';
  return `<div class="dash-row${isNew ? ' new' : ''}">
    <span class="amount">${amountText}</span>
    <div class="payee">${escapeHtml(payee)}</div>
    <div class="meta">${receiptNo}จ่ายเมื่อ ${escapeHtml(paymentDate)}</div>
    <div class="meta">บันทึกเมื่อ ${formatSavedAt(row.saved_at)}</div>
  </div>`;
}

function renderDashboard(rows) {
  if (!rows.length) {
    dashBody.innerHTML = '<div class="dash-empty">ยังไม่มีรายการที่บันทึก</div>';
    return;
  }
  dashBody.innerHTML = rows.map(r => dashRowHtml(r, false)).join('');
}

function prependDashRow(data) {
  const empty = dashBody.querySelector('.dash-empty');
  if (empty) empty.remove();
  dashBody.insertAdjacentHTML('afterbegin', dashRowHtml(data, true));
}

async function loadDashboard() {
  dashBody.innerHTML = '<div class="dash-empty">กำลังโหลด...</div>';
  try {
    const res = await fetch('/api/expenses');
    const rows = await res.json();
    renderDashboard(rows);
  } catch (err) {
    dashBody.innerHTML = '<div class="dash-empty">โหลดข้อมูลไม่สำเร็จ</div>';
  }
}

refreshBtn.addEventListener('click', loadDashboard);

// ---------- เริ่มต้น ----------

addBubble('bot', { text: 'สวัสดีครับ พิมพ์คำถามได้เลย หรือแนบรูปใบเสร็จเพื่อบันทึกรายจ่ายอัตโนมัติ' });
loadDashboard();
</script>

</body>
</html>
